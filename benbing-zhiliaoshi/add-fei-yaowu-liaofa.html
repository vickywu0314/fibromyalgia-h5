<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>非药物疗法</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/treatment.css"></head><body><main class="page form-page" data-kind="fei-yaowu-liaofa" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>非药物疗法</h1><form id="entryForm"><fieldset class="choice-group"><legend class="sr-only">是否有记录</legend><label><input type="radio" name="hasEntry" value="无">无</label><label><input type="radio" name="hasEntry" value="有">有</label></fieldset><div id="details"><label class="field"><span class="field-label">非药物名称</span><select class="control" name="name"><option value="">请选择非药物疗法</option><option>太极拳</option><option>八段锦</option><option>针灸</option><option>拔罐</option><option>推拿</option><option>耳针</option><option>中药熏洗</option><option>穴位贴敷</option><option>耳电针</option><option>针刀疗法</option><option>穴位埋线</option><option>刮痧</option><option>揿针</option><option>芳香疗法</option><option>瑜伽</option><option>冥想</option><option>其他</option></select><input class="control custom-name" name="customName" placeholder="请输入具体治疗名称" aria-label="名称（具体治疗）" hidden></label><label class="field"><span class="field-label">单次时长</span><span class="form-row"><select class="control" name="duration"><option value="">请选择单次时长</option><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option><option>50</option><option>55</option><option>60</option></select><span class="unit">分钟</span></span></label><label class="field"><span class="field-label">频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option>日1次</option><option>日2次</option><option>日3次</option><option>隔日1次</option><option>一周1次</option><option>一周2次</option><option>一周3次</option><option>一周4次</option><option>一周5次</option><option>一周6次</option><option>一周7次</option><option>每月1次</option><option>每月2次</option><option>每月3次</option></select></label><label class="field"><span class="field-label">开始日期</span><input class="control" type="date" name="startDate" aria-label="开始日期"></label><fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset><div class="stopped" id="stopped" hidden><label class="inline-field"><span>结束日期</span><input class="control" type="date" name="endDate" aria-label="结束日期"></label><label class="inline-field"><span>停用原因</span><select class="control" name="reason"><option value="">请选择停用原因</option><option>疗效不佳或无效</option><option>症状缓解</option><option>不良反应</option><option>患者自行停用</option><option>经济原因</option><option>治疗方案调整</option><option>疗程结束</option><option>其他</option></select></label></div></div><div class="form-actions"><button type="submit" class="primary">保存并返回</button><p class="hint" id="message" role="alert"></p></div></form></main><script src="./js/treatment.js"></script></body></html>
