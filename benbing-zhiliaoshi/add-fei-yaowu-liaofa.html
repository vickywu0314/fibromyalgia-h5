<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>非药物疗法</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/treatment.css"></head>
<body><main class="page form-page" data-kind="fei-yaowu-liaofa" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>非药物疗法</h1>
<form id="entryForm" novalidate>
<fieldset class="choice-group"><legend class="sr-only">是否使用非药物疗法</legend><label><input type="radio" name="hasEntry" value="无">无</label><label><input type="radio" name="hasEntry" value="有">有</label></fieldset>
<div id="details" hidden>
<label class="field"><span class="field-label">非药物名称</span><select class="control" name="name"></select></label>
<label class="field" id="customRow" hidden><span class="field-label">其他非药物名称</span><input class="control" name="customName" placeholder="请输入非药物名称" autocomplete="off"></label>
<div class="item-detail" id="itemDetail" hidden>
<label class="field"><span class="field-label">单次时长</span><span class="form-row"><select class="control" name="duration"></select><span class="unit">分钟</span></span></label>
<label class="field"><span class="field-label">频次</span><select class="control" name="frequency"></select></label>
</div>
<label class="field"><span class="field-label">开始日期</span><input class="control" type="date" name="startDate" aria-label="开始日期"></label>
<fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset>
<div class="stopped" id="stopped" hidden><label class="inline-field"><span>结束日期</span><input class="control" type="date" name="endDate" aria-label="结束日期"></label><label class="inline-field"><span>停用原因</span><select class="control" name="reason"></select></label></div>
</div>
<div class="form-actions"><button type="submit" class="primary">保存</button><p class="hint" id="message" role="alert"></p></div>
</form></main><script src="./js/drug-data.js"></script><script src="./js/entry-form.js"></script></body></html>
