<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口服西药</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/treatment.css"></head>
<body><main class="page form-page" data-kind="xiyao" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成0%</p></section><h1>口服西药</h1>
<form id="entryForm" novalidate>
<fieldset class="choice-group"><legend class="sr-only">是否使用口服西药</legend><label><input type="radio" name="hasEntry" value="无">无</label><label><input type="radio" name="hasEntry" value="有">有</label></fieldset>
<div id="details" hidden>
<!-- 与本次治疗方案西药一致：药物分类 → 药品名称 → 剂量 → 频次；「其他」为手填名称 + 用量(mg) + 频次；非甾体抗炎药只选药品 --><label class="field"><span class="field-label">药物分类</span><select class="control" name="category"></select></label><label class="field" id="nameWrap" hidden><span class="field-label">药品名称</span><select class="control" name="medication"></select></label><label class="field" id="customWrap" hidden><span class="field-label">药品名称</span><input class="control" name="customName" maxlength="50" placeholder="请输入药品名称"></label><label class="field" id="doseWrap" hidden><span class="field-label">剂量</span><span class="form-row"><select class="control" name="dose"></select><span class="unit" id="doseUnit">mg</span></span></label><label class="field" id="otherDoseWrap" hidden><span class="field-label">用量</span><span class="form-row"><input class="control" name="otherDose" type="number" min="0" step="any" inputmode="decimal" placeholder="请输入用量"><span class="unit">mg</span></span></label><label class="field" id="freqWrap" hidden><span class="field-label">频次</span><select class="control" name="frequency"></select></label><label class="field"><span class="field-label">开始日期</span><input class="control" type="date" name="startDate" aria-label="开始日期"></label>
<fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset>
<div class="stopped" id="stopped" hidden><label class="inline-field"><span>结束日期</span><input class="control" type="date" name="endDate" aria-label="结束日期"></label><label class="inline-field"><span>停用原因</span><select class="control" name="reason"></select></label></div>
</div>
<div class="form-actions"><button type="submit" class="primary">保存</button><p class="hint" id="message" role="alert"></p></div>
</form></main><script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="../js/fms-select.js"></script><script src="../js/fms-progress.js"></script><script src="./js/store.js"></script><script src="./js/drug-data.js"></script><script src="../zhiliao-fangan/js/catalog.js"></script><script src="./js/entry-form.js"></script></body></html>
