<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口服西药</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/add-xiyao.css"></head>
<body><main class="page"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>口服西药</h1>
<form class="form" id="medForm"><fieldset class="choice-group"><legend class="sr-only">是否使用口服西药</legend><label><input type="radio" name="hasMedication" value="无">无</label><label><input type="radio" name="hasMedication" value="有">有</label></fieldset>
<div class="detail" id="detail"><label class="field"><span class="field-label">西药名称</span><select class="control" name="medication" id="medication"><option value="">请选择西药</option><option value="艾司唑仑">艾司唑仑</option><option value="其他">其他（自行填写）</option></select></label><label class="field" id="customField" hidden><span class="field-label">其他西药名称</span><input class="control" name="customMedication" placeholder="请输入西药名称" autocomplete="off"></label>
<label class="field"><span class="field-label">频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option>日1次</option><option>日2次</option><option>日3次</option><option>按需服用</option></select></label>
<label class="field"><span class="field-label">用量</span><span class="form-row"><select class="control" name="dose"><option value="">请选择用量</option><option>0.5</option><option>1</option><option>2</option><option>3</option><option>4</option></select><span class="unit">(片/粒)</span></span></label>
<label class="field"><span class="field-label">开始日期</span><input class="control" name="startDate" type="date" aria-label="开始日期"></label>
<fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset>
<div class="inline-field" id="endDateRow" hidden><span>结束日期</span><input class="control" name="endDate" type="date" aria-label="结束日期"></div>
<label class="inline-field" id="reasonRow" hidden><span>停用原因</span><select class="control" name="reason"><option value="">请选择停用原因</option><option>疗效不佳或无效</option><option>不良反应</option><option>病情好转</option><option>其他</option></select></label></div>
<div class="form-actions"><button class="primary" type="submit">保存</button><p class="hint" id="message" role="alert"></p></div></form></main><script src="../js/fms-api.js"></script><script src="../js/case-view.js"></script><script src="../js/case-edit.js"></script><script src="./js/add-xiyao.js"></script></body></html>
