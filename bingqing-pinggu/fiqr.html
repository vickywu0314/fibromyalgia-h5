<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>整体病情评估：修订版纤维肌痛影响问卷（FIQR）</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/assessment.css"></head><body><main class="page"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成0%</p></section><h1>整体病情评估：修订版纤维肌痛影响问卷（FIQR）</h1><form class="assess-form" data-assessment="fiqr"><h2 class="group-heading">1、功能</h2><p class="subintro">请在标尺上选出过去一周中纤维肌痛给您进行下列各项活动造成的困难程度。</p><div class="scale-item"><label for="fiqr_1_1">（1）梳头</label><input class="range" id="fiqr_1_1" name="fiqr_1_1" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_1">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_2">（2）连续步行20分钟</label><input class="range" id="fiqr_1_2" name="fiqr_1_2" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_2">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_3">（3）做饭</label><input class="range" id="fiqr_1_3" name="fiqr_1_3" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_3">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_4">（4）使用吸尘器/擦地/扫地</label><input class="range" id="fiqr_1_4" name="fiqr_1_4" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_4">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_5">（5）拎装满食品的袋子</label><input class="range" id="fiqr_1_5" name="fiqr_1_5" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_5">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_6">（6）爬一层楼梯</label><input class="range" id="fiqr_1_6" name="fiqr_1_6" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_6">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_7">（7）换床单</label><input class="range" id="fiqr_1_7" name="fiqr_1_7" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_7">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_8">（8）在椅子上坐45分钟</label><input class="range" id="fiqr_1_8" name="fiqr_1_8" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_8">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_1_9">（9）去买食品杂货等</label><input class="range" id="fiqr_1_9" name="fiqr_1_9" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_1_9">5</output><span>10</span></div></div><h2 class="group-heading">2、整体影响</h2><p class="subintro">请在标尺上选出过去一周中纤维肌痛对您的总体影响程度。</p><div class="scale-item"><label for="fiqr_2_1">（1）纤维肌痛使我无法完成一周的计划</label><input class="range" id="fiqr_2_1" name="fiqr_2_1" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_2_1">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_2_2">（2）纤维肌痛症已经完全压垮了我</label><input class="range" id="fiqr_2_2" name="fiqr_2_2" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_2_2">5</output><span>10</span></div></div><h2 class="group-heading">3、症状</h2><p class="subintro">请在标尺上选出过去一周中您纤维肌痛相关症状严重程度。</p><div class="scale-item"><label for="fiqr_3_1">（1）请评估您的疼痛程度</label><input class="range" id="fiqr_3_1" name="fiqr_3_1" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_1">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_2">（2）请评估您的精力程度</label><input class="range" id="fiqr_3_2" name="fiqr_3_2" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_2">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_3">（3）请评估您的身体僵硬程度</label><input class="range" id="fiqr_3_3" name="fiqr_3_3" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_3">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_4">（4）请评估您的睡眠质量</label><input class="range" id="fiqr_3_4" name="fiqr_3_4" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_4">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_5">（5）请评估您的抑郁程度</label><input class="range" id="fiqr_3_5" name="fiqr_3_5" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_5">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_6">（6）请评估您的记忆力</label><input class="range" id="fiqr_3_6" name="fiqr_3_6" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_6">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_7">（7）请评估您的焦虑程度</label><input class="range" id="fiqr_3_7" name="fiqr_3_7" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_7">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_8">（8）请评估您的触痛程度</label><input class="range" id="fiqr_3_8" name="fiqr_3_8" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_8">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_9">（9）请评估您的平衡感</label><input class="range" id="fiqr_3_9" name="fiqr_3_9" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_9">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_10">（10）请评估您对噪音、明亮光线、异味和寒冷的敏感度</label><input class="range" id="fiqr_3_10" name="fiqr_3_10" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_10">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_10_1">（10-1）请评估您对噪音的敏感度</label><input class="range" id="fiqr_3_10_1" name="fiqr_3_10_1" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_10_1">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_10_2">（10-2）请评估您对明亮光线的敏感度</label><input class="range" id="fiqr_3_10_2" name="fiqr_3_10_2" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_10_2">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_10_3">（10-3）请评估您对异味的敏感度</label><input class="range" id="fiqr_3_10_3" name="fiqr_3_10_3" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_10_3">5</output><span>10</span></div></div><div class="scale-item"><label for="fiqr_3_10_4">（10-4）请评估您对寒冷的敏感度</label><input class="range" id="fiqr_3_10_4" name="fiqr_3_10_4" type="range" min="0" max="10" step="1" value="5"><div class="ticks"><span>0</span><output for="fiqr_3_10_4">5</output><span>10</span></div></div><div class="save-area"><button type="submit" class="primary">保存并返回</button><p class="error" role="alert"></p><a class="back-link" href="index.html">返回病情评估</a></div></form></main><script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="./js/assessment.js"></script></body></html>
