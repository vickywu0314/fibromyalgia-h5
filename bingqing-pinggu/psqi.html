<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>睡眠评估：匹兹堡睡眠质量量表（PSQI）</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/assessment.css"></head><body><main class="page"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>睡眠评估：匹兹堡睡眠质量量表（PSQI）</h1><form class="assess-form" data-assessment="psqi"><p class="intro">说明：下面的问题是关于您最近1个月的睡眠情况，请选择或填写最符合您近1个月实际情况的答案。</p><div class="question"><label class="field-label" for="bedtime">1．近1个月，晚上上床睡觉通常几点钟</label><input class="control" id="bedtime" type="time" name="bedtime"></div><fieldset class="question"><legend>2．近1个月，从上床到入睡通常需要多少分钟</legend><div class="radio-list"><label><input type="radio" name="latency" value="0"><span>≤15min</span></label><label><input type="radio" name="latency" value="1"><span>16-30min</span></label><label><input type="radio" name="latency" value="2"><span>31~60min</span></label><label><input type="radio" name="latency" value="3"><span>≥60min</span></label></div></fieldset><div class="question"><label class="field-label" for="waketime">3．近1个月，通常早上几点起床</label><input class="control" id="waketime" type="time" name="waketime"></div><div class="question"><label class="field-label" for="hours">4．近1个月，每夜通常实际睡眠多少小时（不等于卧床时间）</label><input class="control" id="hours" type="number" min="0" max="24" step="0.5" inputmode="decimal" name="hours" placeholder="请输入小时数"></div><p class="group-heading">5．近1个月，因下列情况影响睡眠而烦恼，如有，请说明：</p><fieldset class="question"><legend>a．入睡困难（30分钟内不能入睡）</legend><div class="radio-list"><label><input type="radio" name="psqi5_1" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_1" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_1" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_1" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>b．夜间易醒或早醒</legend><div class="radio-list"><label><input type="radio" name="psqi5_2" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_2" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_2" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_2" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>c．夜间去厕所</legend><div class="radio-list"><label><input type="radio" name="psqi5_3" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_3" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_3" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_3" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>d．呼吸不畅</legend><div class="radio-list"><label><input type="radio" name="psqi5_4" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_4" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_4" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_4" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>e．咳嗽或鼾声高</legend><div class="radio-list"><label><input type="radio" name="psqi5_5" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_5" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_5" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_5" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>f．感觉冷</legend><div class="radio-list"><label><input type="radio" name="psqi5_6" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_6" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_6" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_6" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>g．感觉热</legend><div class="radio-list"><label><input type="radio" name="psqi5_7" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_7" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_7" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_7" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>h．做恶梦</legend><div class="radio-list"><label><input type="radio" name="psqi5_8" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_8" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_8" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_8" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>i．疼痛不适</legend><div class="radio-list"><label><input type="radio" name="psqi5_9" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_9" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_9" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_9" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>j．其它影响睡眠的事情</legend><div class="radio-list"><label><input type="radio" name="psqi5_10" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi5_10" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi5_10" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi5_10" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>6．近1个月，总的来说，您认为自己的睡眠质量</legend><div class="radio-list"><label><input type="radio" name="psqi6" value="0"><span>(1)很好</span></label><label><input type="radio" name="psqi6" value="1"><span>(2)较好</span></label><label><input type="radio" name="psqi6" value="2"><span>(3)较差</span></label><label><input type="radio" name="psqi6" value="3"><span>(4)很差</span></label></div></fieldset><fieldset class="question"><legend>7．近1个月，您用药物催眠的情况</legend><div class="radio-list"><label><input type="radio" name="psqi7" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi7" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi7" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi7" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>8．近1个月，您常感到困倦吗</legend><div class="radio-list"><label><input type="radio" name="psqi8" value="0"><span>(1)无</span></label><label><input type="radio" name="psqi8" value="1"><span>(2)＜1次/周</span></label><label><input type="radio" name="psqi8" value="2"><span>(3)1-2次/周</span></label><label><input type="radio" name="psqi8" value="3"><span>(4)≥3次/周</span></label></div></fieldset><fieldset class="question"><legend>9．近1个月，您做事情的精力不足吗</legend><div class="radio-list"><label><input type="radio" name="psqi9" value="0"><span>(1)没有</span></label><label><input type="radio" name="psqi9" value="1"><span>(2)偶尔有</span></label><label><input type="radio" name="psqi9" value="2"><span>(3)有时有</span></label><label><input type="radio" name="psqi9" value="3"><span>(4)经常有</span></label></div></fieldset><div class="save-area"><button class="primary" type="submit">保存并返回</button><p class="error" role="alert"></p><a class="back-link" href="index.html">返回病情评估</a></div></form></main><script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="./js/assessment.js"></script></body></html>
