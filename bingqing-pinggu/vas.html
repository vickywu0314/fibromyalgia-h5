<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>疼痛评估</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/assessment.css"></head><body><main class="page"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成0%</p></section><h1>疼痛评估</h1><form class="assess-form" data-assessment="vas"><h2 class="group-heading">疼痛VAS</h2><p class="intro">说明：0～10的数字代表不同程度的疼痛，请您自己圈出一个最能代表过去1周疼痛程度的数字。0为无痛，1-3为轻度疼痛（间断疼痛），4-7为中度疼痛（持续疼痛，但不影响睡眠），7-9为重度疼痛（不能入睡或睡眠中疼醒），10为剧痛。</p><div class="scale-item"><label for="vas">0-10分VAS标尺</label><input class="range" id="vas" name="vas" type="range" min="0" max="10" step="0.1" value="5"><div class="fine-scale" aria-hidden="true"><span class="int" style="left:0%"><i></i><b>0</b></span><span class="int" style="left:10%"><i></i><b>1</b></span><span class="int" style="left:20%"><i></i><b>2</b></span><span class="int" style="left:30%"><i></i><b>3</b></span><span class="int" style="left:40%"><i></i><b>4</b></span><span class="int" style="left:50%"><i></i><b>5</b></span><span class="int" style="left:60%"><i></i><b>6</b></span><span class="int" style="left:70%"><i></i><b>7</b></span><span class="int" style="left:80%"><i></i><b>8</b></span><span class="int" style="left:90%"><i></i><b>9</b></span><span class="int" style="left:100%"><i></i><b>10</b></span><span class="half" style="left:5%"><i></i></span><span class="half" style="left:15%"><i></i></span><span class="half" style="left:25%"><i></i></span><span class="half" style="left:35%"><i></i></span><span class="half" style="left:45%"><i></i></span><span class="half" style="left:55%"><i></i></span><span class="half" style="left:65%"><i></i></span><span class="half" style="left:75%"><i></i></span><span class="half" style="left:85%"><i></i></span><span class="half" style="left:95%"><i></i></span></div><div class="fine-value"><button type="button" class="step-btn" data-for="vas" data-delta="-0.1" aria-label="减 0.1">−</button><span>当前：<output for="vas">5</output> 分</span><button type="button" class="step-btn" data-for="vas" data-delta="0.1" aria-label="加 0.1">+</button></div></div><h2 class="group-heading">近期肌肉疼痛性质</h2><div class="checkbox-list"><label><input type="checkbox" name="painNature" value="酸痛">酸痛</label><label><input type="checkbox" name="painNature" value="胀痛">胀痛</label><label><input type="checkbox" name="painNature" value="冷痛">冷痛</label><label><input type="checkbox" name="painNature" value="刺痛">刺痛</label><label><input type="checkbox" name="painNature" value="钝痛">钝痛</label><label><input type="checkbox" name="painNature" value="灼痛">灼痛</label><label><input type="checkbox" name="painNature" value="窜痛">窜痛</label></div><h2 class="group-heading">疼痛评估</h2><div class="scale-item"><label for="pain1">1、选择下面的一个数字，以表示过去24小时内您疼痛最剧烈的程度。</label><input class="range" id="pain1" name="pain1" type="range" min="0" max="10" step="0.1" value="5"><div class="fine-scale" aria-hidden="true"><span class="int" style="left:0%"><i></i><b>0</b></span><span class="int" style="left:10%"><i></i><b>1</b></span><span class="int" style="left:20%"><i></i><b>2</b></span><span class="int" style="left:30%"><i></i><b>3</b></span><span class="int" style="left:40%"><i></i><b>4</b></span><span class="int" style="left:50%"><i></i><b>5</b></span><span class="int" style="left:60%"><i></i><b>6</b></span><span class="int" style="left:70%"><i></i><b>7</b></span><span class="int" style="left:80%"><i></i><b>8</b></span><span class="int" style="left:90%"><i></i><b>9</b></span><span class="int" style="left:100%"><i></i><b>10</b></span><span class="half" style="left:5%"><i></i></span><span class="half" style="left:15%"><i></i></span><span class="half" style="left:25%"><i></i></span><span class="half" style="left:35%"><i></i></span><span class="half" style="left:45%"><i></i></span><span class="half" style="left:55%"><i></i></span><span class="half" style="left:65%"><i></i></span><span class="half" style="left:75%"><i></i></span><span class="half" style="left:85%"><i></i></span><span class="half" style="left:95%"><i></i></span></div><div class="fine-value"><button type="button" class="step-btn" data-for="pain1" data-delta="-0.1" aria-label="减 0.1">−</button><span>当前：<output for="pain1">5</output> 分</span><button type="button" class="step-btn" data-for="pain1" data-delta="0.1" aria-label="加 0.1">+</button></div></div><div class="scale-item"><label for="pain2">2、请选择下面的一个数字，以表示过去24小时内您疼痛最轻微的程度。</label><input class="range" id="pain2" name="pain2" type="range" min="0" max="10" step="0.1" value="5"><div class="fine-scale" aria-hidden="true"><span class="int" style="left:0%"><i></i><b>0</b></span><span class="int" style="left:10%"><i></i><b>1</b></span><span class="int" style="left:20%"><i></i><b>2</b></span><span class="int" style="left:30%"><i></i><b>3</b></span><span class="int" style="left:40%"><i></i><b>4</b></span><span class="int" style="left:50%"><i></i><b>5</b></span><span class="int" style="left:60%"><i></i><b>6</b></span><span class="int" style="left:70%"><i></i><b>7</b></span><span class="int" style="left:80%"><i></i><b>8</b></span><span class="int" style="left:90%"><i></i><b>9</b></span><span class="int" style="left:100%"><i></i><b>10</b></span><span class="half" style="left:5%"><i></i></span><span class="half" style="left:15%"><i></i></span><span class="half" style="left:25%"><i></i></span><span class="half" style="left:35%"><i></i></span><span class="half" style="left:45%"><i></i></span><span class="half" style="left:55%"><i></i></span><span class="half" style="left:65%"><i></i></span><span class="half" style="left:75%"><i></i></span><span class="half" style="left:85%"><i></i></span><span class="half" style="left:95%"><i></i></span></div><div class="fine-value"><button type="button" class="step-btn" data-for="pain2" data-delta="-0.1" aria-label="减 0.1">−</button><span>当前：<output for="pain2">5</output> 分</span><button type="button" class="step-btn" data-for="pain2" data-delta="0.1" aria-label="加 0.1">+</button></div></div><div class="scale-item"><label for="pain3">3、请选择下面的一个数字，以表示过去24小时内您疼痛的平均程度。</label><input class="range" id="pain3" name="pain3" type="range" min="0" max="10" step="0.1" value="5"><div class="fine-scale" aria-hidden="true"><span class="int" style="left:0%"><i></i><b>0</b></span><span class="int" style="left:10%"><i></i><b>1</b></span><span class="int" style="left:20%"><i></i><b>2</b></span><span class="int" style="left:30%"><i></i><b>3</b></span><span class="int" style="left:40%"><i></i><b>4</b></span><span class="int" style="left:50%"><i></i><b>5</b></span><span class="int" style="left:60%"><i></i><b>6</b></span><span class="int" style="left:70%"><i></i><b>7</b></span><span class="int" style="left:80%"><i></i><b>8</b></span><span class="int" style="left:90%"><i></i><b>9</b></span><span class="int" style="left:100%"><i></i><b>10</b></span><span class="half" style="left:5%"><i></i></span><span class="half" style="left:15%"><i></i></span><span class="half" style="left:25%"><i></i></span><span class="half" style="left:35%"><i></i></span><span class="half" style="left:45%"><i></i></span><span class="half" style="left:55%"><i></i></span><span class="half" style="left:65%"><i></i></span><span class="half" style="left:75%"><i></i></span><span class="half" style="left:85%"><i></i></span><span class="half" style="left:95%"><i></i></span></div><div class="fine-value"><button type="button" class="step-btn" data-for="pain3" data-delta="-0.1" aria-label="减 0.1">−</button><span>当前：<output for="pain3">5</output> 分</span><button type="button" class="step-btn" data-for="pain3" data-delta="0.1" aria-label="加 0.1">+</button></div></div><div class="scale-item"><label for="pain4">4、请选择下面的一个数字，以表示您目前的疼痛程度。</label><input class="range" id="pain4" name="pain4" type="range" min="0" max="10" step="0.1" value="5"><div class="fine-scale" aria-hidden="true"><span class="int" style="left:0%"><i></i><b>0</b></span><span class="int" style="left:10%"><i></i><b>1</b></span><span class="int" style="left:20%"><i></i><b>2</b></span><span class="int" style="left:30%"><i></i><b>3</b></span><span class="int" style="left:40%"><i></i><b>4</b></span><span class="int" style="left:50%"><i></i><b>5</b></span><span class="int" style="left:60%"><i></i><b>6</b></span><span class="int" style="left:70%"><i></i><b>7</b></span><span class="int" style="left:80%"><i></i><b>8</b></span><span class="int" style="left:90%"><i></i><b>9</b></span><span class="int" style="left:100%"><i></i><b>10</b></span><span class="half" style="left:5%"><i></i></span><span class="half" style="left:15%"><i></i></span><span class="half" style="left:25%"><i></i></span><span class="half" style="left:35%"><i></i></span><span class="half" style="left:45%"><i></i></span><span class="half" style="left:55%"><i></i></span><span class="half" style="left:65%"><i></i></span><span class="half" style="left:75%"><i></i></span><span class="half" style="left:85%"><i></i></span><span class="half" style="left:95%"><i></i></span></div><div class="fine-value"><button type="button" class="step-btn" data-for="pain4" data-delta="-0.1" aria-label="减 0.1">−</button><span>当前：<output for="pain4">5</output> 分</span><button type="button" class="step-btn" data-for="pain4" data-delta="0.1" aria-label="加 0.1">+</button></div></div><div class="save-area"><button type="submit" class="primary">保存并返回</button><p class="error" role="alert"></p></div></form></main><script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="./js/assessment.js"></script></body></html>
