<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口服西药</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/add-xiyao.css"></head>
<body><main class="page"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>口服西药</h1>
<form class="form" id="medForm"><fieldset class="choice-group"><legend class="sr-only">是否使用口服西药</legend><label><input type="radio" name="hasMedication" value="无">无</label><label><input type="radio" name="hasMedication" value="有">有</label></fieldset>
<div class="detail" id="detail"><label class="field"><span class="field-label">西药名称</span><select class="control" name="medication" id="medication"><option value="">请选择西药</option><option>普瑞巴林胶囊</option><option>度洛西汀肠溶胶囊/片</option><option>加巴喷丁胶囊/片</option><option>盐酸米那普仑片</option><option>盐酸阿米替林片</option><option>盐酸曲马多胶囊/片/缓释片</option><option>文拉法辛胶囊/片/缓释胶囊/缓释片</option><option>对乙酰氨基酚片</option><option>布洛芬缓释胶囊</option><option>塞来昔布胶囊</option><option>双氯芬酸钠缓释片/肠溶胶囊</option><option>依托考昔片</option><option>酒石酸唑吡坦片</option><option>右佐匹克隆片</option><option>劳拉西泮片</option><option>盐酸舍曲林片</option><option>草酸艾司西酞普兰片</option><option>盐酸曲唑酮缓释片</option><option>甲钴胺片</option><option>美洛昔康片</option><option>氯硝西泮片</option><option>艾司唑仑</option><option>氟哌噻吨美利曲辛</option><option>氨酚羟考酮片</option><option>洛索洛芬钠片</option><option>尼美舒利片</option><option>奥氮平片</option><option>迈之灵片</option><option>甲泼尼龙片</option><option>醋酸泼尼松片</option><option>吲哚美辛片</option><option>帕罗西汀</option><option>米氮平片</option></select></label>
<label class="field"><span class="field-label">频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option>日1次</option><option>日2次</option><option>日3次</option><option>晚1次</option></select></label>
<label class="field"><span class="field-label">用量</span><span class="form-row"><select class="control" name="dose"><option value="">请选择用量</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><span class="unit">(片/粒)</span></span></label>
<label class="field"><span class="field-label">开始日期</span><input class="control" name="startDate" type="date" aria-label="开始日期"></label>
<fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset>
<div class="inline-field" id="endDateRow" hidden><span>结束日期</span><input class="control" name="endDate" type="date" aria-label="结束日期"></div>
<label class="inline-field" id="reasonRow" hidden><span>停用原因</span><select class="control" name="reason"><option value="">请选择停用原因</option><option>疗效不佳或无效</option><option>症状缓解</option><option>不良反应</option><option>患者自行停用</option><option>经济原因</option><option>治疗方案调整</option><option>疗程结束</option><option>其他</option></select></label></div>
<div class="form-actions"><button class="primary" type="submit">保存</button><p class="hint" id="message" role="alert"></p></div></form></main><script src="./js/add-xiyao.js"></script></body></html>
