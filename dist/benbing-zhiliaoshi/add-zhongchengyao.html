<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口服中成药</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/treatment.css"></head><body><main class="page form-page" data-kind="zhongchengyao" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>口服中成药</h1><form id="entryForm"><fieldset class="choice-group"><legend class="sr-only">是否有记录</legend><label><input type="radio" name="hasEntry" value="无">无</label><label><input type="radio" name="hasEntry" value="有">有</label></fieldset><div id="details"><label class="field"><span class="field-label">中成药名称</span><select class="control" name="name"><option value="">请选择中成药</option><option>痛祺胶囊</option><option>其他</option></select><input class="control custom-name" name="customName" placeholder="请输入其他中成药名称" hidden></label><label class="field"><span class="field-label">频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option>日1次</option><option>日2次</option><option>日3次</option><option>按需服用</option></select></label><label class="field"><span class="field-label">用量</span><span class="form-row"><select class="control" name="dose"><option value="">请选择用量</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><span class="unit">(片/粒)</span></span></label><label class="field"><span class="field-label">开始时间</span><input class="control" type="date" name="startDate" aria-label="开始时间"></label><label class="field"><span class="field-label">结束时间</span><input class="control" type="date" name="endDate" aria-label="结束时间"></label></div><div class="form-actions"><button type="submit" class="primary">保存</button><p class="hint" id="message" role="alert"></p></div></form></main><script src="./js/treatment.js"></script></body></html>
