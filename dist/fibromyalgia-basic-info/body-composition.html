<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>人体成分分析</title><link rel="stylesheet" href="css/body-composition.css"></head><body>
<main class="page"><section class="progress-block"><div class="progress"><span style="width:0%"></span></div><p>已完成0%</p></section>
<form id="form"><h1>人体成分分析</h1><section class="form-list"><!-- 按需求：身高 ____cm、体重 ___._Kg；体脂等为 __ __.__（两位整数一位小数）；去掉去脂体重、内脏脂肪等级；腰臀比 0.__ __（两位 0-9 下拉） --><label class="field"><span>身高</span><span class="unit"><input type="text" name="height" inputmode="decimal" data-int="3" data-dec="0" placeholder="如 165" autocomplete="off"><b>cm</b></span></label><label class="field"><span>体重</span><span class="unit"><input type="text" name="weight" inputmode="decimal" data-int="3" data-dec="1" placeholder="如 60.5" autocomplete="off"><b>Kg</b></span></label><label class="field"><span>体脂百分比</span><span class="unit"><input type="text" name="bodyFatPercentage" inputmode="decimal" data-int="2" data-dec="1" placeholder="00.0" autocomplete="off"><b>%</b></span></label><label class="field"><span>体脂肪</span><span class="unit"><input type="text" name="bodyFatMass" inputmode="decimal" data-int="2" data-dec="1" placeholder="00.0" autocomplete="off"><b>Kg</b></span></label><label class="field"><span>骨骼肌量</span><span class="unit"><input type="text" name="skeletalMuscleMass" inputmode="decimal" data-int="2" data-dec="1" placeholder="00.0" autocomplete="off"><b>Kg</b></span></label><label class="field"><span>骨骼肌指数（SMI）</span><span class="unit"><input type="text" name="skeletalMuscleIndex" inputmode="decimal" data-int="2" data-dec="1" placeholder="00.0" autocomplete="off"><b>Kg</b></span></label><div class="field"><span>腰臀比</span><span class="ratio-digits" role="group" aria-label="腰臀比"><b>0.</b><select name="whr1" aria-label="腰臀比小数第一位"><option value="">-</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select><select name="whr2" aria-label="腰臀比小数第二位"><option value="">-</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></span></div></section>
<section class="upload"><h2>上传检验</h2><label class="upload-box" for="file"><strong>＋</strong><span>上传图片</span></label><input id="file" type="file" accept=".jpg,.jpeg,.png,.gif" hidden><p>支持 jpg、png、gif 格式，文件大小不超过5M</p><div id="preview" hidden><img id="previewImg"><button type="button" id="remove">删除图片</button></div></section>
<div class="bottom"><button type="submit">保存并返回</button></div></form></main><script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="../js/fms-upload.js"></script><script src="../js/fms-progress.js"></script>
  <script src="js/form-utils.js"></script><script src="js/body-composition.js"></script></body></html>
