<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>间接成本评估</title>
  <link rel="stylesheet" href="css/work.css">
</head>
<body>
  <!-- App WebView 页面：不设置 H5 顶部导航，由原生 App 统一提供 -->
  <main class="page">
    <section class="progress-block" aria-label="填写进度">
      <div class="progress"><span style="width:30%"></span></div>
      <p>已完成30%</p>
    </section>

    <form id="workForm">
      <h1>间接成本评估：工作生产力及活动受损问卷</h1>

      <fieldset class="question" id="q1">
        <legend>1. 您现在有没有带收入的工作？</legend>
        <div class="options">
          <label><input type="radio" name="q1" value="是">是</label>
          <label><input type="radio" name="q1" value="否">否</label>
        </div>
      </fieldset>

      <div id="workQuestions">
        <fieldset class="question">
          <legend>2. 过去7天内，您因健康问题缺勤了多少小时？</legend>
          <p class="help">包括病假、迟到、早退等因健康问题减少的工作时间；不包括参加本研究所占用的时间。</p>
          <label class="number-line">
            <input type="number" name="q2" min="0" step="0.5" inputmode="decimal" aria-label="因健康问题缺勤小时数">
            <span>小时</span>
          </label>
        </fieldset>

        <fieldset class="question">
          <legend>3. 过去7天内，您因其他原因缺勤多少小时？</legend>
          <p class="help">例如休假、节假日、参加本研究等。</p>
          <label class="number-line">
            <input type="number" name="q3" min="0" step="0.5" inputmode="decimal" aria-label="因其他原因缺勤小时数">
            <span>小时</span>
          </label>
        </fieldset>

        <fieldset class="question">
          <legend>4. 过去7天内，您实际工作了多少小时？</legend>
          <label class="number-line">
            <input id="actualHours" type="number" name="q4" min="0" step="0.5" inputmode="decimal" aria-label="实际工作小时数">
            <span>小时</span>
          </label>
        </fieldset>

        <fieldset class="question" id="q5">
          <legend>5. 过去7天内，健康问题在多大程度上影响了您工作时的工作效率？</legend>
          <div class="options endpoint-options">
            <label><input type="radio" name="q5" value="健康问题对我的工作没有影响">健康问题对我的工作没有影响</label>
            <label><input type="radio" name="q5" value="健康问题使我完全无法工作">健康问题使我完全无法工作</label>
          </div>
        </fieldset>
      </div>

      <fieldset class="question" id="q6">
        <legend>6. 过去7天内，健康问题在多大程度上影响了您进行日常活动的能力（不包括有偿工作）？</legend>
        <p class="help">日常活动包括做家务、购物、照顾孩子、锻炼、学习等。</p>
        <div class="options endpoint-options">
          <label><input type="radio" name="q6" value="健康问题对我的日常活动没有影响">健康问题对我的日常活动没有影响</label>
          <label><input type="radio" name="q6" value="健康问题使我完全无法进行日常活动">健康问题使我完全无法进行日常活动</label>
        </div>
      </fieldset>

      <div class="bottom-action">
        <button type="submit">保存并返回</button>
      </div>
    </form>
  </main>
  <script src="js/work.js"></script>
</body>
</html>
