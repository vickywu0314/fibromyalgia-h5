<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>添加合并药物</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/medication.css"></head><body><main class="page" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>合并药物</h1><form id="medicationForm" class="entry-form"><label class="field"><span>药物名称</span><input class="control" type="text" name="name" placeholder="请输入药物名称" autocomplete="off" maxlength="100" required></label><label class="field"><span>剂量</span><input class="control" type="number" name="dose" placeholder="请输入剂量" inputmode="decimal" min="0" step="any"></label><label class="field"><span>单位</span><input class="control" type="text" name="unit" placeholder="请输入单位，如 mg、片" autocomplete="off" maxlength="20"></label><label class="field"><span>频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option value="日1次">日1次</option><option value="日2次">日2次</option><option value="日3次">日3次</option><option value="日4次">日4次</option><option value="晚1次">晚1次</option><option value="每4小时1次">每4小时1次</option><option value="每6小时1次">每6小时1次</option><option value="每12小时1次">每12小时1次</option><option value="隔日1次">隔日1次</option><option value="每周1次">每周1次</option><option value="每周2次">每周2次</option><option value="每周3次">每周3次</option><option value="必要时">必要时</option></select></label><label class="field"><span>开始日期</span><input class="control" type="date" name="startDate"></label><fieldset class="field choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset><div class="stop-detail" id="stopDetail" hidden><label class="field"><span>结束日期</span><input class="control" type="date" name="endDate"></label><label class="field"><span>停用原因</span><select class="control" name="stopReason"><option value="">请选择停用原因</option><option value="疗效不佳或无效">疗效不佳或无效</option><option value="症状缓解">症状缓解</option><option value="不良反应">不良反应</option><option value="患者自行停用">患者自行停用</option><option value="经济原因">经济原因</option><option value="治疗方案调整">治疗方案调整</option><option value="疗程结束">疗程结束</option><option value="其他">其他</option></select></label></div><div class="form-bottom"><button class="primary" type="submit">保存</button><p class="error" id="error" role="alert"></p></div></form></main><script src="./js/medication.js"></script></body></html>
