<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>非药物疗法</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/plan.css"></head><body><main class="page form-page" data-page="form" data-kind="fei-yaowu"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span></span></div><p>已完成30%</p></section><h1>非药物疗法</h1><form id="planForm">
<fieldset class="choice-group"><legend>是否使用</legend><label><input type="radio" name="是否使用" value="无"><span>无</span></label><label><input type="radio" name="是否使用" value="有"><span>有</span></label></fieldset>
<div class="details" id="details">
<label class="field"><span class="field-title">非药物名称</span><select class="control" name="name"><option value="">请选择非药物疗法</option><option>太极拳</option><option>八段锦</option><option>针灸</option><option>拔罐</option><option>推拿</option><option>耳针</option><option>中药熏洗</option><option>穴位贴敷</option><option>耳电针</option><option>针刀疗法</option><option>穴位埋线</option><option>刮痧</option><option>揿针</option><option>芳香疗法</option><option>瑜伽</option><option>冥想</option><option>其他</option></select></label>
<label class="field" id="customNameField"><span class="field-title">治疗名称</span><input class="control" name="customName" placeholder="请输入治疗名称"></label>
<label class="field"><span class="field-title">单次时长</span><span class="dose-line"><select class="control" name="duration"><option value="">请选择单次时长</option><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option><option>50</option><option>55</option><option>60</option></select><span class="unit">分钟</span></span></label>
<label class="field"><span class="field-title">频次</span><select class="control" name="frequency"><option value="">请选择频次</option><option>日1次</option><option>日2次</option><option>日3次</option><option>隔日1次</option><option>一周1次</option><option>一周2次</option><option>一周3次</option><option>一周4次</option><option>一周5次</option><option>一周6次</option><option>一周7次</option><option>每月1次</option><option>每月2次</option><option>每月3次</option></select></label>
<fieldset class="choice-group"><legend>是否调整非药物疗法</legend><label><input type="radio" name="是否调整" value="是"><span>是</span></label><label><input type="radio" name="是否调整" value="否"><span>否</span></label></fieldset>
<div class="adjust-details" id="adjustDetails"><fieldset class="choice-group"><legend>调整内容</legend><label><input type="radio" name="调整内容" value="增加单次时长"><span>增加单次时长</span></label><label><input type="radio" name="调整内容" value="减少单次时长"><span>减少单次时长</span></label><label><input type="radio" name="调整内容" value="增加频次"><span>增加频次</span></label><label><input type="radio" name="调整内容" value="减少频次"><span>减少频次</span></label><label><input type="radio" name="调整内容" value="停止当前非药物疗法"><span>停止当前非药物疗法</span></label><label><input type="radio" name="调整内容" value="更换非药物疗法"><span>更换非药物疗法</span></label></fieldset><fieldset class="choice-group"><legend>调整原因</legend><label><input type="radio" name="调整原因" value="疗效不佳或无效"><span>疗效不佳或无效</span></label><label><input type="radio" name="调整原因" value="症状缓解"><span>症状缓解</span></label><label><input type="radio" name="调整原因" value="不良反应"><span>不良反应</span></label><label><input type="radio" name="调整原因" value="患者自行停用"><span>患者自行停用</span></label><label><input type="radio" name="调整原因" value="经济原因"><span>经济原因</span></label><label><input type="radio" name="调整原因" value="治疗方案调整"><span>治疗方案调整</span></label><label><input type="radio" name="调整原因" value="疗程结束"><span>疗程结束</span></label><label><input type="radio" name="调整原因" value="其他"><span>其他</span></label></fieldset></div>
</div>
<div class="form-actions"><button class="primary" type="submit">保存</button><p class="error" id="error" role="alert"></p></div></form></main><script src="./js/plan.js"></script></body></html>
