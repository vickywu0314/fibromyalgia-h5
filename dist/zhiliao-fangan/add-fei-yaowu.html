<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>非药物疗法</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/plan.css"></head><body>
<main class="page form-page" data-page="form" data-kind="fei-yaowu">
<section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span></span></div><p>已完成30%</p></section>
<h1>非药物疗法</h1>
<form id="planForm">
<label class="field"><span class="field-title">非药物名称</span><select class="control" name="name"></select></label>
<div class="sub-block" id="customBox" hidden><label class="field"><span class="field-title">请填写其他非药物疗法名称</span><input class="control" name="customName" placeholder="请输入疗法名称"></label></div>
<div class="details" id="details" hidden>
<label class="field"><span class="field-title">单次时长</span><span class="dose-line"><select class="control" name="dose"></select><span class="unit" id="unit">分钟</span></span></label>
<label class="field"><span class="field-title">频次</span><select class="control" name="frequency"></select></label>
</div>
<div class="form-actions"><button class="primary" type="submit">保存并返回</button><button class="danger" id="deleteItem" type="button" hidden>删除该记录</button><p class="error" id="error" role="alert"></p></div>
</form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="./js/catalog.js"></script><script src="./js/plan.js"></script>
</body></html>
