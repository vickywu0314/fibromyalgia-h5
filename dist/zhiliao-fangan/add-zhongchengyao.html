<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中成药</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/plan.css"></head><body><main class="page form-page" data-page="form" data-kind="zhongchengyao"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span></span></div><p>已完成30%</p></section><h1>中成药</h1><form id="planForm">
<fieldset class="choice-group"><legend>是否使用</legend><label><input type="radio" name="是否使用" value="无"><span>无</span></label><label><input type="radio" name="是否使用" value="有"><span>有</span></label></fieldset>
<div class="details" id="details">
<label class="field"><span class="field-title">药物名称</span><select class="control" name="name"><option value="">请选择中成药</option></select></label>
<label class="field" id="doseField"><span class="field-title">单次剂量</span><span class="dose-line"><select class="control" name="dose"><option value="">请选择单次剂量</option></select><span class="unit" id="doseUnit"></span></span></label>
<label class="field" id="frequencyField"><span class="field-title">频次</span><select class="control" name="frequency"><option value="">请选择频次</option></select></label>
<fieldset class="choice-group"><legend>是否调整中成药</legend><label><input type="radio" name="是否调整" value="是"><span>是</span></label><label><input type="radio" name="是否调整" value="否"><span>否</span></label></fieldset>
<div class="adjust-details" id="adjustDetails"><fieldset class="choice-group"><legend>调整内容</legend><label><input type="radio" name="调整内容" value="加量"><span>加量</span></label><label><input type="radio" name="调整内容" value="减量"><span>减量</span></label><label><input type="radio" name="调整内容" value="停药"><span>停药</span></label><label><input type="radio" name="调整内容" value="换药"><span>换药</span></label></fieldset><fieldset class="choice-group"><legend>调整原因</legend><label><input type="radio" name="调整原因" value="疗效不佳或无效"><span>疗效不佳或无效</span></label><label><input type="radio" name="调整原因" value="症状缓解"><span>症状缓解</span></label><label><input type="radio" name="调整原因" value="不良反应"><span>不良反应</span></label><label><input type="radio" name="调整原因" value="患者自行停用"><span>患者自行停用</span></label><label><input type="radio" name="调整原因" value="经济原因"><span>经济原因</span></label><label><input type="radio" name="调整原因" value="治疗方案调整"><span>治疗方案调整</span></label><label><input type="radio" name="调整原因" value="疗程结束"><span>疗程结束</span></label><label><input type="radio" name="调整原因" value="其他"><span>其他</span></label></fieldset></div>
</div>
<div class="form-actions"><button class="primary" type="submit">保存并返回</button><p class="error" id="error" role="alert"></p></div></form></main><script src="./js/catalog.js"></script><script src="./js/plan.js"></script></body></html>
