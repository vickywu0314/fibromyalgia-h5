<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>不良反应</title>
<link rel="stylesheet" href="css/adverse-reaction.css">
</head>
<body>
<main class="page">
  <section class="progress-block">
    <div class="progress"><span></span></div>
    <p>已完成30%</p>
  </section>

  <form id="adverseForm">
    <fieldset class="question has-event">
      <legend>不良反应</legend>
      <div class="inline-options">
        <label><input type="radio" name="hasAdverseEvent" value="无">无</label>
        <label><input type="radio" name="hasAdverseEvent" value="有">有</label>
      </div>
    </fieldset>

    <!-- 选“有”才显示以下内容 -->
    <section id="eventDetails" hidden>
      <fieldset class="question">
        <legend>不良反应症状<span class="hint">（可多选）</span></legend>
        <div class="check-list">
          <label><input type="checkbox" name="adverseEvents" value="肝功能损伤">肝功能损伤</label>
          <label><input type="checkbox" name="adverseEvents" value="肾功能损伤">肾功能损伤</label>
          <label><input type="checkbox" name="adverseEvents" value="头晕">头晕（38%）</label>
          <label><input type="checkbox" name="adverseEvents" value="恶心">恶心（23%）</label>
          <label><input type="checkbox" name="adverseEvents" value="嗜睡">嗜睡（20%）</label>
          <label><input type="checkbox" name="adverseEvents" value="头痛">头痛（12%）</label>
          <label><input type="checkbox" name="adverseEvents" value="体重增加">体重增加（11%）</label>
          <label><input type="checkbox" name="adverseEvents" value="失眠">失眠（10%）</label>
          <label><input type="checkbox" name="adverseEvents" value="腹泻">腹泻（9%）</label>
          <label><input type="checkbox" name="adverseEvents" value="视物模糊">视物模糊（8%）</label>
          <label><input type="checkbox" name="adverseEvents" value="口干">口干（8%）</label>
          <label><input type="checkbox" name="adverseEvents" value="食欲下降">食欲下降（8%）</label>
          <label><input type="checkbox" name="adverseEvents" value="便秘">便秘（7%）</label>
          <label><input type="checkbox" name="adverseEvents" value="疲劳">疲劳（7%）</label>
          <label><input type="checkbox" name="adverseEvents" value="外周水肿">外周水肿（6%）</label>
          <label><input type="checkbox" name="adverseEvents" value="欣快情绪">欣快情绪（6%）</label>
          <label><input type="checkbox" name="adverseEvents" value="多汗">多汗（6%）</label>
          <label><input type="checkbox" name="adverseEvents" value="鼻窦炎">鼻窦炎（5%）</label>
          <label><input type="checkbox" name="adverseEvents" value="食欲增加">食欲增加（5%）</label>
          <label><input type="checkbox" name="adverseEvents" value="注意力障碍">注意力障碍（5%）</label>
          <label><input type="checkbox" name="adverseEvents" value="平衡障碍">平衡障碍（5%）</label>
          <label><input type="checkbox" name="adverseEvents" value="腹痛">腹痛（5%）</label>
          <label><input type="checkbox" name="adverseEvents" value="皮疹">皮疹</label>
          <label><input type="checkbox" name="adverseEvents" value="其他">其他</label>
        </div>
      </fieldset>

      <label class="field">
        <span>发生日期</span>
        <input type="date" name="startDate">
      </label>

      <label class="field">
        <span>结束日期</span>
        <input type="date" name="endDate">
      </label>

      <fieldset class="question">
        <legend>SAE类别<span class="hint">（非SAE可不选，再次点击可取消）</span></legend>
        <div class="radio-list">
          <label><input type="radio" name="saeCategory" value="致命">致命</label>
          <label><input type="radio" name="saeCategory" value="危及生命">危及生命</label>
          <label><input type="radio" name="saeCategory" value="需要住院治疗或延长住院时间">需要住院治疗或延长住院时间</label>
          <label><input type="radio" name="saeCategory" value="能力丧失">能力丧失</label>
          <label><input type="radio" name="saeCategory" value="母亲使用研究药物导致新生儿不良事件">母亲使用研究药物导致新生儿不良事件</label>
          <label><input type="radio" name="saeCategory" value="由医生判断为重大医疗事件">由医生判断为重大医疗事件</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>采取与药物的相关措施</legend>
        <div class="radio-list">
          <label><input type="radio" name="drugMeasure" value="剂量不变">剂量不变</label>
          <label><input type="radio" name="drugMeasure" value="减小剂量">减小剂量</label>
          <label><input type="radio" name="drugMeasure" value="停止用药">停止用药</label>
          <label><input type="radio" name="drugMeasure" value="对症治疗">对症治疗</label>
        </div>
      </fieldset>

      <label class="field textarea-field">
        <span>其他措施</span>
        <textarea name="otherMeasures"></textarea>
      </label>

      <label class="field textarea-field">
        <span>不良事件详情</span>
        <textarea name="adverseEventDetails"></textarea>
      </label>
    </section>

    <div class="bottom-action"><button type="submit">保存并返回</button></div>
  </form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script>
<script src="js/adverse-reaction.js"></script>
</body>
</html>
