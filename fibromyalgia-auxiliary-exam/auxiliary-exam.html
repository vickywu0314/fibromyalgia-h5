<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>辅助检查</title>
<link rel="stylesheet" href="css/auxiliary-exam.css">
</head>
<body>
<main class="page">
  <section class="progress-block"><div class="progress"><span></span></div><p>已完成30%</p></section>

  <form id="examForm">
    <h1>检验</h1>

    <!-- 每组右侧“未查”与该组数值并列：勾选“未查”后隐藏并清空该组数值 -->
    <section class="exam-section">
      <div class="section-title"><h2>血常规</h2><label class="badge-toggle"><input type="checkbox" name="cbc_notDone" value="未查" data-toggle-off="cbc_notDoneBody">未查</label></div>
      <div id="cbc_notDoneBody">
      <div class="item"><h3>白细胞</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="cbc_wbc"><span>×10^9/L</span></div></div>
      <div class="item"><h3>红细胞</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="cbc_rbc"><span>×10^12/L</span></div></div>
      <div class="item"><h3>血红蛋白</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="cbc_hgb"><span>g/L</span></div></div>
      </div>
    </section>

    <section class="exam-section">
      <div class="section-title"><h2>尿常规</h2><label class="badge-toggle"><input type="checkbox" name="urine_notDone" value="未查" data-toggle-off="urine_notDoneBody">未查</label></div>
      <div id="urine_notDoneBody">
      <div class="item"><h3>白细胞</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="urine_wbc"><span>leu/uL</span></div></div>
      <div class="item"><h3>红细胞</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="urine_rbc"><span>/uL</span></div></div>
      <div class="item"><h3>尿蛋白</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="urine_protein"><span>g/L</span></div></div>
      <div class="item"><h3>尿潜血</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="urine_occult"><span>ery/uL</span></div></div>
      </div>
    </section>

    <section class="exam-section">
      <div class="section-title"><h2>便常规</h2><label class="badge-toggle"><input type="checkbox" name="stool_notDone" value="未查" data-toggle-off="stool_notDoneBody">未查</label></div>
      <div id="stool_notDoneBody">
      <div class="item"><h3>潜血</h3><div class="radios inline"><label><input type="radio" name="stool_occult" value="阴性">阴性</label><label><input type="radio" name="stool_occult" value="阳性">阳性</label></div></div>
      </div>
    </section>

    <section class="exam-section">
      <div class="section-title"><h2>生化</h2><label class="badge-toggle"><input type="checkbox" name="biochem_notDone" value="未查" data-toggle-off="biochem_notDoneBody">未查</label></div>
      <div id="biochem_notDoneBody">
      <h2 class="subhead">肝功能</h2>
      <div class="item"><h3>ALT</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="alt"><span>U/L</span></div></div>
      <div class="item"><h3>AST</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="ast"><span>U/L</span></div></div>
      <h2 class="subhead">肾功能</h2>
      <div class="item"><h3>BUN</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="bun"><span>mmol/L</span></div></div>
      <div class="item"><h3>Cr</h3><div class="value"><input type="number" step="any" inputmode="decimal" name="cr"><span>umol/L</span></div></div>
      <h2 class="subhead">血糖</h2>
      <div class="item"><div class="value"><input type="number" step="any" inputmode="decimal" name="glucose"><span>mmol/L</span></div></div>
      </div>
    </section>


    <h1 class="ecg-title">心电图</h1>
    <section class="exam-section">
      <div class="radios ecg">
        <label><input type="radio" name="ecg" value="正常">正常</label>
        <label><input type="radio" name="ecg" value="T波改变">T波改变</label>
        <label><input type="radio" name="ecg" value="ST改变">ST改变</label>
        <label><input type="radio" name="ecg" value="传导阻滞">传导阻滞</label>
        <label><input type="radio" name="ecg" value="心律失常">心律失常</label>
        <label><input type="radio" name="ecg" value="其他">其他</label>
        <label><input type="radio" name="ecg" value="未查">未查</label>
      </div>
    </section>

    <h1 class="ecg-title">上传检验报告</h1>
    <section class="exam-section uploads">
      <p class="upload-tip">图片格式：jpg、png、gif；图片大小不超过5M</p>
      <div class="upload-grid">
        <div class="upload"><h3>检验报告</h3><label class="upload-box" for="labReport"><span>＋</span><small>上传图片</small></label><input id="labReport" name="labReport" type="file" accept=".jpg,.jpeg,.png,.gif" hidden><div id="labPreview" class="preview" hidden><img alt=""></div></div>
        <div id="ecgUploadBody"><div class="upload"><h3>心电图报告</h3><label class="upload-box" for="ecgReport"><span>＋</span><small>上传图片</small></label><input id="ecgReport" name="ecgReport" type="file" accept=".jpg,.jpeg,.png,.gif" hidden><div id="ecgPreview" class="preview" hidden><img alt=""></div></div></div>
      </div>
    </section>

    <div class="bottom"><button type="submit">保存并返回</button></div>
  </form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script>
<script src="js/auxiliary-exam.js"></script>
</body>
</html>
