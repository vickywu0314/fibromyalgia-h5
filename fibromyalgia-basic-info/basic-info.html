<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>基本信息</title>
  <link rel="stylesheet" href="css/basic-info-base.css">
  <link rel="stylesheet" href="css/basic-info.css">
</head>
<body>
  <!-- App WebView 页面：不包含返回箭头、标题栏等 H5 导航，由原生 App 统一提供 -->
  <main class="page">
    <section class="progress-block" aria-label="填写进度">
      <div class="progress"><span style="width:30%"></span></div>
      <p>已完成30%</p>
    </section>

    <form id="basicInfoForm" autocomplete="off">
      <section class="form-section">
        <div class="field">
          <label for="visitDate">本次就诊时间</label>
          <input id="visitDate" name="visitDate" type="date">
        </div>

        <div class="field">
          <label for="name">姓名</label>
          <input id="name" name="name" type="text" placeholder="请输入姓名">
          <p class="error" id="nameError" hidden>请输入姓名</p>
        </div>

        <div class="field">
          <label for="idCard">身份证号</label>
          <input id="idCard" name="idCard" type="text" inputmode="text" maxlength="18" placeholder="请输入身份证号">
          <p class="error" id="idCardError" hidden>请输入正确的15位或18位身份证号</p>
        </div>


        <fieldset class="field">
          <legend>性别</legend>
          <div class="choices inline">
            <label><input type="radio" name="gender" value="男"> 男</label>
            <label><input type="radio" name="gender" value="女"> 女</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="province">常住地</label>
          <div class="inline-fields">
            <select id="province" name="province" aria-label="常住地省份">
              <option value="">请选择省</option>
            </select>
            <select id="city" name="city" aria-label="常住地城市" disabled>
              <option value="">请选择市</option>
            </select>
          </div>
        </div>

        <fieldset class="field">
          <legend>婚姻</legend>
          <div class="choices">
            <label><input type="radio" name="marriage" value="未婚"> 未婚</label>
            <label><input type="radio" name="marriage" value="已婚"> 已婚</label>
            <label><input type="radio" name="marriage" value="离婚"> 离婚</label>
            <label><input type="radio" name="marriage" value="丧偶"> 丧偶</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>教育程度</legend>
          <div class="choices">
            <label><input type="radio" name="education" value="未上过学"> 未上过学</label>
            <label><input type="radio" name="education" value="小学及初中"> 小学及初中</label>
            <label><input type="radio" name="education" value="高中或中专"> 高中或中专</label>
            <label><input type="radio" name="education" value="大学本科或大专"> 大学本科或大专</label>
            <label><input type="radio" name="education" value="研究生"> 研究生</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>工作情况</legend>
          <div class="choices">
            <label><input type="radio" name="workStatus" value="在职人员"> 在职人员</label>
            <label><input type="radio" name="workStatus" value="退休人员"> 退休人员</label>
            <label><input type="radio" name="workStatus" value="家庭主妇"> 家庭主妇</label>
            <label><input type="radio" name="workStatus" value="无业人员"> 无业人员</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>吸烟史</legend>
          <div class="choices">
            <label><input type="radio" name="smoking" value="无或偶尔有"> 无或偶尔有</label>
            <label><input type="radio" name="smoking" value="经常有"> 经常有</label>
          </div>
          <div id="smokingDetail" class="conditional" hidden>
            <label class="amount-line">已吸 <input class="mini" name="smokingYears" type="number" min="0" step="1" inputmode="numeric" aria-label="吸烟年数"> 年</label>
            <div>
              <p class="sub-label">每日</p>
              <div class="choices">
            <label><input type="radio" name="smokingAmount" value="10支以下"> 10支以下</label>
            <label><input type="radio" name="smokingAmount" value="10-20支"> 10-20支</label>
            <label><input type="radio" name="smokingAmount" value="20支及以上"> 20支及以上</label>
          </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>饮酒史</legend>
          <div class="choices">
            <label><input type="radio" name="drinking" value="无或偶尔有"> 无或偶尔有</label>
            <label><input type="radio" name="drinking" value="经常有"> 经常有</label>
          </div>
          <div id="drinkingDetail" class="conditional" hidden>
            <label class="amount-line">已饮 <input class="mini" name="drinkingYears" type="number" min="0" step="1" inputmode="numeric" aria-label="饮酒年数"> 年</label>
            <div>
              <p class="sub-label">酒类（可多选）</p>
              <div class="drink-list">
                <div class="drink-item">
                  <label><input type="checkbox" name="drinkType" value="白酒" data-amount="baijiuAmount"> 白酒</label>
                  <label class="amount-line drink-amount" hidden>每天用量 <input class="mini wide" id="baijiuAmount" name="baijiuAmount" type="number" min="0" inputmode="decimal" aria-label="白酒每天用量"> ml</label>
                </div>
                <div class="drink-item">
                  <label><input type="checkbox" name="drinkType" value="啤酒" data-amount="beerAmount"> 啤酒</label>
                  <label class="amount-line drink-amount" hidden>每天用量 <input class="mini wide" id="beerAmount" name="beerAmount" type="number" min="0" inputmode="decimal" aria-label="啤酒每天用量"> ml</label>
                </div>
                <div class="drink-item">
                  <label><input type="checkbox" name="drinkType" value="红酒" data-amount="wineAmount"> 红酒</label>
                  <label class="amount-line drink-amount" hidden>每天用量 <input class="mini wide" id="wineAmount" name="wineAmount" type="number" min="0" inputmode="decimal" aria-label="红酒每天用量"> ml</label>
                </div>
              </div>
            </div>
          </div>
        </fieldset>


      </section>

      <section class="submodule-section" aria-labelledby="submoduleTitle">
        <div class="submodule-heading">
          <div>
            <h2 id="submoduleTitle">评估与病史</h2>
            <p>请逐项完善患者相关信息</p>
          </div>
          <div class="submodule-count">已完成 <strong id="submoduleCount">0/10</strong></div>
        </div>

        <div class="submodule-list">
          <button type="button" class="submodule-row menu-row" data-page="csi" data-key="csi">
            <span class="submodule-copy"><strong>中枢敏化程度：中枢敏化指数（CSI-9）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="tpc" data-key="tpc">
            <span class="submodule-copy"><strong>压痛点（TPC）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="fs" data-key="fs">
            <span class="submodule-copy"><strong>纤维肌痛症状量表（FS）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="work" data-key="work">
            <span class="submodule-copy"><strong>间接成本评估：工作生产力及活动受损问卷</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="body" data-key="bodyComposition">
            <span class="submodule-copy"><strong>人体成分分析</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="tipi" data-key="tipi">
            <span class="submodule-copy"><strong>人格评估：中国版10项目大五人格量表（TIPI-C）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="sffq" data-key="sffq">
            <span class="submodule-copy"><strong>膳食摄入评估：半定量膳食频率问卷（SFFQ）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="treatmentHistory" data-key="treatmentHistory">
            <span class="submodule-copy"><strong>本病治疗史</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="diseaseHistory" data-key="diseaseHistory">
            <span class="submodule-copy"><strong>合并疾病（既往疾病史）</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
          <button type="button" class="submodule-row menu-row" data-page="concomitantMedication" data-key="concomitantMedication">
            <span class="submodule-copy"><strong>合并药物</strong><small class="status pending">未填写</small></span><span class="chevron">›</span>
          </button>
        </div>
      </section>

      <section class="form-section consent" aria-labelledby="consentTitle">
        <h2 id="consentTitle">患者知情同意告知与签署</h2>
        <p class="consent-tip">请患者在下方框内手写电子签名</p>
        <div class="signature-pad" id="signaturePad">
          <canvas id="signatureCanvas" aria-label="电子签字区域"></canvas>
          <img id="signatureImg" alt="患者电子签名" hidden>
          <span class="signature-placeholder" id="signaturePlaceholder">请在此处签字</span>
        </div>
        <div class="signature-actions">
          <button type="button" class="link-btn" id="signatureClear">重新签字</button>
        </div>
      </section>

      <div class="bottom-action">
        <button class="primary" type="submit">保存并返回</button>
      </div>
    </form>
  </main>

  <script src="../js/fms-api.js"></script>
  <script src="../js/fms-case.js"></script>
  <script src="js/form-utils.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/basic-info-bridge.js"></script>
  <script src="js/basic-info.js"></script>
</body>
</html>
