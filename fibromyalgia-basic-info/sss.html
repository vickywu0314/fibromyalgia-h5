<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>症状严重性量表（SSS）</title>
  <link rel="stylesheet" href="css/sss.css">
</head>
<body>
<main class="page">
  <section class="progress-block" aria-label="填写进度">
    <div class="progress"><span id="progressBar" style="width:0%"></span></div>
    <p id="progressText">已完成0%</p>
  </section>

  <form id="sssForm">
    <h1>症状严重性量表（SSS）</h1>

    <section class="question-block">
      <h2>1. 在过去一周中以下症状的严重程度</h2>

      <fieldset class="question">
        <legend>（1）疲劳</legend>
        <div class="options">
          <label><input type="radio" name="q1_1" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q1_1" value="1（轻度）">1（轻度）</label>
          <label><input type="radio" name="q1_1" value="2（中度）">2（中度）</label>
          <label><input type="radio" name="q1_1" value="3（重度）">3（重度）</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>（2）认知症状（注意力、记忆力下降）</legend>
        <div class="options">
          <label><input type="radio" name="q1_2" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q1_2" value="1（轻度）">1（轻度）</label>
          <label><input type="radio" name="q1_2" value="2（中度）">2（中度）</label>
          <label><input type="radio" name="q1_2" value="3（重度）">3（重度）</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>（3）睡醒后仍觉得疲乏</legend>
        <div class="options">
          <label><input type="radio" name="q1_3" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q1_3" value="1（轻度）">1（轻度）</label>
          <label><input type="radio" name="q1_3" value="2（中度）">2（中度）</label>
          <label><input type="radio" name="q1_3" value="3（重度）">3（重度）</label>
        </div>
      </fieldset>
    </section>

    <section class="question-block">
      <h2>2. 在过去六个月是否曾受以下症状困扰</h2>

      <fieldset class="question">
        <legend>（1）头痛</legend>
        <div class="options">
          <label><input type="radio" name="q2_1" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q2_1" value="1（曾经出现）">1（曾经出现）</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>（2）下腹疼痛或痉挛</legend>
        <div class="options">
          <label><input type="radio" name="q2_2" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q2_2" value="1（曾经出现）">1（曾经出现）</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>（3）抑郁</legend>
        <div class="options">
          <label><input type="radio" name="q2_3" value="0（没有）">0（没有）</label>
          <label><input type="radio" name="q2_3" value="1（曾经出现）">1（曾经出现）</label>
        </div>
      </fieldset>
    </section>

    <div class="bottom-action"><button type="submit" id="saveBtn">保存并返回</button></div>
  </form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="../js/fms-progress.js"></script><script src="js/form-utils.js"></script>
<script src="js/fs.js"></script>
<script src="js/sss.js"></script>
</body>
</html>
