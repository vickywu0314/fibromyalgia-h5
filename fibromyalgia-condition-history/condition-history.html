<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>病史病情</title>
<link rel="stylesheet" href="css/condition-history.css">
</head>
<body>
<!-- App WebView 页面：不设置 H5 顶部导航，由原生 App 统一提供 -->
<main class="page">
  <section class="progress-block"><div class="progress"><span id="progressBar" style="width:0%"></span></div><p id="progressText">已完成0%</p></section>
  <form id="conditionForm">

    <section class="section">
      <h2>1.周身疼痛发病时间</h2>
      <label class="field"><span class="sr-only">周身疼痛发病时间</span><input class="control" type="date" name="painOnsetDate"></label>
    </section>

    <section class="section">
      <h2>2.是否曾确诊纤维肌痛综合征</h2>
      <div class="radios">
        <label><input type="radio" name="diagnosed" value="是">是</label>
        <div class="reveal" data-when="diagnosed=是" hidden>
          <label class="field"><span>确诊时间</span><input class="control" type="date" name="diagnosisDate"></label>
        </div>
        <label><input type="radio" name="diagnosed" value="否">否</label>
      </div>
    </section>




    <section class="section">
      <h2>3.发病诱因（可多选）</h2>
      <div class="radios">
        <label><input type="checkbox" name="onsetTriggers" value="无" data-exclusive>无</label>
        <label><input type="checkbox" name="onsetTriggers" value="车祸">车祸</label>
        <label><input type="checkbox" name="onsetTriggers" value="手术">手术</label>
        <label><input type="checkbox" name="onsetTriggers" value="外伤">外伤</label>
        <label><input type="checkbox" name="onsetTriggers" value="感染">感染</label>
        <label><input type="checkbox" name="onsetTriggers" value="妊娠">妊娠</label>
        <label><input type="checkbox" name="onsetTriggers" value="生产或流产">生产或流产</label>
        <label><input type="checkbox" name="onsetTriggers" value="其他">其他</label>
      </div>
    </section>

    <section class="section">
      <h2>4.加重诱因（可多选）</h2>
      <div class="radios">
        <label><input type="checkbox" name="aggravatingTriggers" value="无" data-exclusive>无</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="体力劳动">体力劳动</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="情绪波动">情绪波动</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="睡眠不足">睡眠不足</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="精神压力">精神压力</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="感冒">感冒</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="感染">感染</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="身体伤害">身体伤害</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="过敏">过敏</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="月经来潮">月经来潮</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="饮食不当">饮食不当</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="自然界因素">自然界因素</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="非自然界因素">非自然界因素</label>
        <label><input type="checkbox" name="aggravatingTriggers" value="其他">其他</label>
      </div>
    </section>

    <section class="section">
      <h2>5.肌肉疼痛性质（可多选）</h2>
      <div class="radios">
        <label><input type="checkbox" name="painNature" value="酸痛">酸痛</label>
        <label><input type="checkbox" name="painNature" value="胀痛">胀痛</label>
        <label><input type="checkbox" name="painNature" value="冷痛">冷痛</label>
        <label><input type="checkbox" name="painNature" value="刺痛">刺痛</label>
        <label><input type="checkbox" name="painNature" value="钝痛">钝痛</label>
        <label><input type="checkbox" name="painNature" value="灼痛">灼痛</label>
        <label><input type="checkbox" name="painNature" value="窜痛">窜痛</label>
      </div>
    </section>

    <section class="section">
      <h2>6.全身症状（可多选）</h2>

      <div class="branch">
        <h3>肝郁气滞</h3>
        <div class="children">
          <label class="check"><input type="checkbox" name="systemic" value="焦虑易怒">焦虑易怒</label>
          <label class="check"><input type="checkbox" name="systemic" value="胸胁胀闷或刺痛">胸胁胀闷或刺痛</label>
          <label class="check"><input type="checkbox" name="systemic" value="寐差多梦">寐差多梦</label>
          <label class="check"><input type="checkbox" name="systemic" value="脘闷嗳气">脘闷嗳气</label>
          <label class="check"><input type="checkbox" name="systemic" value="腹痛">腹痛</label>
          <label class="check"><input type="checkbox" name="systemic" value="不思饮食">不思饮食</label>
          <label class="check"><input type="checkbox" name="systemic" value="疲乏无力">疲乏无力</label>
        </div>
      </div>

      <div class="branch">
        <h3>寒湿痹阻</h3>
        <div class="children">
          <label class="check"><input type="checkbox" name="systemic" value="四肢重着无力">四肢重着无力</label>
          <label class="check"><input type="checkbox" name="systemic" value="每遇寒则冷痛，遇温痛减">每遇寒则冷痛，遇温痛减</label>
        </div>
      </div>

      <div class="branch">
        <h3>痰热扰心</h3>
        <div class="children">
          <label class="check"><input type="checkbox" name="systemic" value="惊悸不安">惊悸不安</label>
          <label class="check"><input type="checkbox" name="systemic" value="口苦心烦">口苦心烦</label>
          <label class="check"><input type="checkbox" name="systemic" value="头痛失眠">头痛失眠</label>
          <label class="check"><input type="checkbox" name="systemic" value="渴喜冷饮">渴喜冷饮</label>
          <label class="check"><input type="checkbox" name="systemic" value="性情急躁">性情急躁</label>
          <label class="check"><input type="checkbox" name="systemic" value="反复梦魇">反复梦魇</label>
          <label class="check"><input type="checkbox" name="systemic" value="恶心纳呆">恶心纳呆</label>
        </div>
      </div>

      <div class="branch">
        <h3>肝肾不足</h3>
        <div class="children">
          <label class="check"><input type="checkbox" name="systemic" value="肌肉无力">肌肉无力</label>
          <label class="check"><input type="checkbox" name="systemic" value="腰膝痠软，劳累加重">腰膝痠软，劳累加重</label>
          <label class="check"><input type="checkbox" name="systemic" value="筋缩，手足不遂">筋缩，手足不遂</label>
          <label class="check"><input type="checkbox" name="systemic" value="畏寒肢冷">畏寒肢冷</label>
          <label class="check"><input type="checkbox" name="systemic" value="肢体麻木">肢体麻木</label>
          <label class="check"><input type="checkbox" name="systemic" value="失眠健忘">失眠健忘</label>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>7.二便</h2>
      <h3>大便</h3>
      <div class="radios">
        <label><input type="radio" name="stool" value="稀溏">稀溏</label>
        <label><input type="radio" name="stool" value="便秘">便秘</label>
        <label><input type="radio" name="stool" value="粘滞">粘滞</label>
        <label><input type="radio" name="stool" value="无力">无力</label>
        <label><input type="radio" name="stool" value="正常">正常</label>
      </div>
      <h3>小便</h3>
      <div class="radios">
        <label><input type="radio" name="urine" value="黄">黄</label>
        <label><input type="radio" name="urine" value="热">热</label>
        <label><input type="radio" name="urine" value="清长">清长</label>
        <label><input type="radio" name="urine" value="夜尿频">夜尿频</label>
        <label><input type="radio" name="urine" value="无力">无力</label>
        <label><input type="radio" name="urine" value="正常">正常</label>
      </div>
    </section>

    <section class="section">
      <h2>8.舌象</h2>
      <h3>舌质</h3>
      <h4>舌色</h4>
      <div class="radios">
        <label><input type="radio" name="tongueColor" value="淡红">淡红</label><label><input type="radio" name="tongueColor" value="淡白">淡白</label><label><input type="radio" name="tongueColor" value="红">红</label><label><input type="radio" name="tongueColor" value="绛">绛</label><label><input type="radio" name="tongueColor" value="紫">紫</label><label><input type="radio" name="tongueColor" value="暗">暗</label>
      </div>
      <h4>舌形</h4>
      <div class="radios">
        <label><input type="radio" name="tongueShape" value="苍老">苍老</label><label><input type="radio" name="tongueShape" value="娇嫩">娇嫩</label><label><input type="radio" name="tongueShape" value="胖大">胖大</label><label><input type="radio" name="tongueShape" value="瘦薄">瘦薄</label><label><input type="radio" name="tongueShape" value="芒刺">芒刺</label><label><input type="radio" name="tongueShape" value="裂纹">裂纹</label><label><input type="radio" name="tongueShape" value="齿痕">齿痕</label><label><input type="radio" name="tongueShape" value="正常">正常</label>
      </div>
      <h3>舌苔</h3>
      <h4>苔色</h4>
      <div class="radios">
        <label><input type="radio" name="coatColor" value="白">白</label><label><input type="radio" name="coatColor" value="黄">黄</label><label><input type="radio" name="coatColor" value="灰">灰</label><label><input type="radio" name="coatColor" value="黑">黑</label><label><input type="radio" name="coatColor" value="黄白相间">黄白相间</label>
      </div>
      <h4>苔质</h4>
      <div class="radios">
        <label><input type="radio" name="coatShape" value="厚">厚</label><label><input type="radio" name="coatShape" value="薄">薄</label><label><input type="radio" name="coatShape" value="润">润</label><label><input type="radio" name="coatShape" value="滑">滑</label><label><input type="radio" name="coatShape" value="燥">燥</label><label><input type="radio" name="coatShape" value="腐">腐</label><label><input type="radio" name="coatShape" value="腻">腻</label><label><input type="radio" name="coatShape" value="剥">剥</label><label><input type="radio" name="coatShape" value="无">无</label>
      </div>
    </section>

    <section class="section">
      <h2>9.月经情况</h2>
      <div class="radios">
        <label><input type="radio" name="menstrualStage" value="绝经期">绝经期</label>
        <label><input type="radio" name="menstrualStage" value="围绝经期">围绝经期</label>
        <div class="reveal menstrual-details" data-when="menstrualStage=围绝经期" hidden>
          <h4>经期</h4>
          <div class="sub-radios">
            <label><input type="radio" name="periodTiming" value="月经先期">月经先期</label>
            <label><input type="radio" name="periodTiming" value="月经后期">月经后期</label>
            <label><input type="radio" name="periodTiming" value="月经先后不定期">月经先后不定期</label>
            <label><input type="radio" name="periodTiming" value="经期延长">经期延长</label>
            <label><input type="radio" name="periodTiming" value="正常">正常</label>
          </div>
          <h4>经色</h4>
          <div class="sub-radios">
            <label><input type="radio" name="periodColor" value="淡红">淡红</label>
            <label><input type="radio" name="periodColor" value="深红">深红</label>
            <label><input type="radio" name="periodColor" value="紫暗">紫暗</label>
            <label><input type="radio" name="periodColor" value="正常">正常</label>
          </div>
          <h4>经量</h4>
          <div class="sub-radios">
            <label><input type="radio" name="periodAmount" value="月经过多">月经过多</label>
            <label><input type="radio" name="periodAmount" value="月经过少">月经过少</label>
            <label><input type="radio" name="periodAmount" value="正常">正常</label>
          </div>
          <h4>痛经</h4>
          <div class="sub-radios">
            <label><input type="radio" name="dysmenorrhea" value="有">有</label>
            <label><input type="radio" name="dysmenorrhea" value="无">无</label>
          </div>
        </div>
        <label><input type="radio" name="menstrualStage" value="育龄期">育龄期</label>
      </div>
    </section>


    <div class="bottom"><button type="submit" id="saveBtn">保存并返回</button></div>
  </form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script>
<script src="js/condition-history.js"></script>
</body></html>
