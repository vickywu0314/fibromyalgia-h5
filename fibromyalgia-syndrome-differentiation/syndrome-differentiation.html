<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>证候判断</title>
<link rel="stylesheet" href="css/syndrome-differentiation.css">
<link rel="stylesheet" href="../css/case-view.css">
</head>
<body>
<main class="page">
  <!-- 原生 App 提供顶部导航；H5 仅保留业务进度 -->
  <section class="progress-block">
    <div class="progress"><span></span></div>
    <p>已完成30%</p>
  </section>

  <form id="syndromeForm">
    <h1>证候判断</h1>

    <fieldset class="question">
      <legend>主证</legend>
      <div class="options">
        <label><input type="radio" name="mainSyndrome" value="肝郁气滞证">肝郁气滞证</label>
        <label><input type="radio" name="mainSyndrome" value="寒湿痹阻证">寒湿痹阻证</label>
        <label><input type="radio" name="mainSyndrome" value="痰热扰心证">痰热扰心证</label>
        <label><input type="radio" name="mainSyndrome" value="肝肾不足证">肝肾不足证</label>
      </div>
    </fieldset>

    <fieldset class="question">
      <legend>是否有兼证</legend>
      <div class="options compact">
        <label><input type="radio" name="hasSecondary" value="是">是</label>
        <label><input type="radio" name="hasSecondary" value="否">否</label>
      </div>

      <div id="secondaryOptions" class="options secondary">
        <label><input type="radio" name="secondarySyndrome" value="肝郁气滞证">肝郁气滞证</label>
        <label><input type="radio" name="secondarySyndrome" value="寒湿痹阻证">寒湿痹阻证</label>
        <label><input type="radio" name="secondarySyndrome" value="痰热扰心证">痰热扰心证</label>
        <label><input type="radio" name="secondarySyndrome" value="肝肾不足证">肝肾不足证</label>
      </div>
    </fieldset>

    <div class="bottom-action">
      <button type="submit">保存并返回</button>
    </div>
  </form>
</main>
<script src="js/syndrome-differentiation.js"></script>
<script src="../js/fms-api.js"></script>
<script src="../js/case-view.js"></script>
<script>CaseView.init(document.getElementById('syndromeForm'), 'zhpd');</script>
</body>
</html>
