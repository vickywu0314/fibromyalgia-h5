<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>既往疾病史</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/history.css"></head><body>
<!-- 新增 / 编辑一条既往疾病：风湿性疾病 / 其他系统疾病（下拉选系统）→ 疾病（其他 / 肿瘤 手动输入）→ 病程（年）
     → 是否长期用药干预（肿瘤为：是否手术、是否放疗/化疗）。逻辑见 js/disease-form.js -->
<main class="page form-page" data-page="disease-form">
<section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div><p>已完成0%</p></section>
<h1>既往疾病史</h1>
<form id="diseaseForm" novalidate>
  <fieldset class="choices type-choices"><legend class="sr-only">疾病类型</legend>
    <label class="choice"><input type="radio" name="type" value="风湿性疾病"><span>风湿性疾病</span></label>
    <label class="choice"><input type="radio" name="type" value="其他系统疾病"><span>其他系统疾病</span></label>
  </fieldset>
  <div class="system-field" id="systemWrap" hidden><select class="control" name="system" aria-label="选择系统"></select></div>
  <fieldset class="choices disease-choices" id="diseaseWrap" hidden><legend class="sr-only">选择疾病</legend><div id="diseaseList"></div></fieldset>
  <label class="other-name" id="otherWrap" hidden><span id="otherLabel">疾病名称</span><input type="text" name="otherName" placeholder="请输入疾病名称" autocomplete="off" maxlength="100"></label>
  <div id="detailWrap" hidden>
    <label class="disease-years"><span>该病病程（年）</span><input type="number" name="years" min="0" max="120" step="1" inputmode="numeric" placeholder="请输入年数" autocomplete="off"></label>
    <fieldset class="choices yn" id="medWrap"><legend>是否长期用药干预</legend>
      <label class="choice"><input type="radio" name="longTermMedication" value="是"><span>是</span></label>
      <label class="choice"><input type="radio" name="longTermMedication" value="否"><span>否</span></label>
    </fieldset>
    <div id="tumorWrap" hidden>
      <fieldset class="choices yn"><legend>是否手术</legend>
        <label class="choice"><input type="radio" name="surgery" value="是"><span>是</span></label>
        <label class="choice"><input type="radio" name="surgery" value="否"><span>否</span></label>
      </fieldset>
      <fieldset class="choices yn"><legend>是否放疗/化疗</legend>
        <label class="choice"><input type="radio" name="radioChemotherapy" value="是"><span>是</span></label>
        <label class="choice"><input type="radio" name="radioChemotherapy" value="否"><span>否</span></label>
      </fieldset>
    </div>
  </div>
  <div class="form-actions"><button class="primary" type="submit">保存</button><p class="error" id="error" role="alert"></p></div>
</form>
</main>
<script src="../js/fms-api.js"></script><script src="../js/fms-case.js"></script><script src="../js/fms-select.js"></script><script src="../js/fms-progress.js"></script><script src="./js/disease-form.js"></script></body></html>
