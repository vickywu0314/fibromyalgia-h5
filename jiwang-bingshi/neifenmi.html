<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>内分泌和代谢性疾病</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/history.css"></head><body><main class="page form-page" data-page="form" data-category="neifenmi"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span></span></div><p>已完成30%</p></section><h1>内分泌和代谢性疾病</h1><form id="historyForm"><fieldset class="choices"><legend class="sr-only">选择疾病</legend><label class="choice"><input type="radio" name="disease" value="2型糖尿病"><span>2型糖尿病</span></label><label class="choice"><input type="radio" name="disease" value="甲状腺疾病（桥本甲状腺炎/甲减/甲亢/甲状腺结节）"><span>甲状腺疾病（桥本甲状腺炎/甲减/甲亢/甲状腺结节）</span></label><label class="choice"><input type="radio" name="disease" value="高脂血症"><span>高脂血症</span></label><label class="choice"><input type="radio" name="disease" value="高尿酸血症"><span>高尿酸血症</span></label><label class="choice"><input type="radio" name="disease" value="骨质疏松"><span>骨质疏松</span></label><label class="choice"><input type="radio" name="disease" value="其他"><span>其他</span></label></fieldset><label class="other-name" id="otherWrap" hidden><span>疾病名称</span><input type="text" name="otherName" placeholder="请输入疾病名称" autocomplete="off" maxlength="100"></label><label class="years"><span>该病病程（月）</span><input type="number" name="months" placeholder="请输入月数" inputmode="numeric" min="0" max="1500" step="1"></label><label class="years"><span>诊断时间</span><input type="date" name="diagnosisDate"></label><div class="form-actions"><button class="primary" type="submit">保存</button><p class="error" id="error" role="alert"></p><a class="text-back" href="choose.html">返回疾病类别</a></div></form></main><script src="./js/history.js"></script></body></html>
