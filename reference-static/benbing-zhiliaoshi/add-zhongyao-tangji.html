<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口服中药汤剂</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/treatment.css"></head><body><main class="page form-page" data-kind="zhongyao-tangji" data-page="form"><section class="progress-block"><div class="progress" role="progressbar" aria-label="填写进度" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>已完成30%</p></section><h1>口服中药汤剂</h1><form id="entryForm"><fieldset class="choice-group"><legend class="sr-only">是否有记录</legend><label><input type="radio" name="hasEntry" value="无">无</label><label><input type="radio" name="hasEntry" value="有">有</label></fieldset><div id="details"><label class="field"><span class="field-label">开始日期</span><input class="control" type="date" name="startDate" aria-label="开始日期"></label><fieldset class="choice-group"><legend>是否沿用至今</legend><label><input type="radio" name="ongoing" value="是">是</label><label><input type="radio" name="ongoing" value="否">否</label></fieldset><div class="stopped" id="stopped" hidden><label class="inline-field"><span>结束日期</span><input class="control" type="date" name="endDate" aria-label="结束日期"></label><label class="inline-field"><span>停用原因</span><select class="control" name="reason"><option value="">请选择停用原因</option><option>疗效不佳或无效</option><option>症状缓解</option><option>不良反应</option><option>患者自行停用</option><option>经济原因</option><option>治疗方案调整</option><option>疗程结束</option><option>其他</option></select></label></div></div><div class="form-actions"><button type="submit" class="primary">保存</button><p class="hint" id="message" role="alert"></p></div></form></main><script src="./js/treatment.js"></script></body></html>
