<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>不良反应</title>
<link rel="stylesheet" href="css/adverse-reaction.css">
</head>
<body>
<main class="page">
  <section class="progress-block">
    <div class="progress"><span></span></div>
    <p>已完成30%</p>
    <p class="subline">是否有不良事件</p>
  </section>

  <section class="last-visit">
    <p>上次随访时间：2026-06-01</p>
    <p>不良反应：头晕、恶心、口干</p>
  </section>

  <form id="adverseForm">
    <fieldset class="question has-event">
      <div class="inline-options">
        <label><input type="radio" name="hasAdverseEvent" value="无">无</label>
        <label><input type="radio" name="hasAdverseEvent" value="有" checked>有</label>
      </div>
    </fieldset>

    <section id="eventDetails">
      <div class="check-list">
<label><input type="checkbox" name="adverseEvents" value="肝功能损伤">肝功能损伤</label><label><input type="checkbox" name="adverseEvents" value="肾功能损伤">肾功能损伤</label><label><input type="checkbox" name="adverseEvents" value="头晕">头晕</label><label><input type="checkbox" name="adverseEvents" value="恶心">恶心</label><label><input type="checkbox" name="adverseEvents" value="恶心">恶心</label><label><input type="checkbox" name="adverseEvents" value="嗜睡">嗜睡</label><label><input type="checkbox" name="adverseEvents" value="头痛">头痛</label><label><input type="checkbox" name="adverseEvents" value="体重增加">体重增加</label><label><input type="checkbox" name="adverseEvents" value="失眠">失眠</label><label><input type="checkbox" name="adverseEvents" value="腹泻">腹泻</label><label><input type="checkbox" name="adverseEvents" value="视物模糊">视物模糊</label><label><input type="checkbox" name="adverseEvents" value="口干">口干</label><label><input type="checkbox" name="adverseEvents" value="食欲下降">食欲下降</label><label><input type="checkbox" name="adverseEvents" value="便秘">便秘</label><label><input type="checkbox" name="adverseEvents" value="疲劳">疲劳</label><label><input type="checkbox" name="adverseEvents" value="外周水肿">外周水肿</label><label><input type="checkbox" name="adverseEvents" value="欣快情绪">欣快情绪</label><label><input type="checkbox" name="adverseEvents" value="多汗">多汗</label><label><input type="checkbox" name="adverseEvents" value="鼻窦炎">鼻窦炎</label><label><input type="checkbox" name="adverseEvents" value="食欲增加">食欲增加</label><label><input type="checkbox" name="adverseEvents" value="注意力障碍">注意力障碍</label><label><input type="checkbox" name="adverseEvents" value="平衡障碍">平衡障碍</label><label><input type="checkbox" name="adverseEvents" value="腹痛">腹痛</label><label><input type="checkbox" name="adverseEvents" value="皮疹">皮疹</label><label><input type="checkbox" name="adverseEvents" value="其他">其他</label>
      </div>

      <label class="field">
        <span>发生日期</span>
        <input type="date" name="startDate">
      </label>

      <label class="field">
        <span>结束日期</span>
        <input type="date" name="endDate">
      </label>

      <fieldset class="question">
        <legend>SAE类别</legend>
        <div class="radio-list">
          <label><input type="radio" name="saeCategory" value="致命">致命</label>
          <label><input type="radio" name="saeCategory" value="危及生命">危及生命</label>
          <label><input type="radio" name="saeCategory" value="需要住院治疗或延长住院时间">需要住院治疗或延长住院时间</label>
          <label><input type="radio" name="saeCategory" value="能力丧失母亲使用研究药物导致新生儿不良事件">能力丧失母亲使用研究药物导致新生儿不良事件</label>
          <label><input type="radio" name="saeCategory" value="由医生判断为重大医疗事件">由医生判断为重大医疗事件</label>
        </div>
      </fieldset>

      <fieldset class="question">
        <legend>采取与药物的相关措施</legend>
        <div class="radio-list">
          <label><input type="radio" name="drugMeasure" value="剂量不变">剂量不变</label>
          <label><input type="radio" name="drugMeasure" value="减小剂量">减小剂量</label>
          <label><input type="radio" name="drugMeasure" value="停止用药">停止用药</label>
          <label><input type="radio" name="drugMeasure" value="对症治疗">对症治疗</label>
        </div>
      </fieldset>

      <label class="field textarea-field">
        <span>其他措施</span>
        <textarea name="otherMeasures"></textarea>
      </label>

      <label class="field textarea-field">
        <span>不良事件详情</span>
        <textarea name="adverseEventDetails"></textarea>
      </label>
    </section>

    <div class="bottom-action"><button type="submit">保存并返回</button></div>
  </form>
</main>
<script src="js/adverse-reaction.js"></script>
</body></html>
