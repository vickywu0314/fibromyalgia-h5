<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>中枢敏化程度</title>
  <link rel="stylesheet" href="css/csi.css">
</head>
<body>
  <!-- App WebView 页面：不设置 H5 顶部导航，由原生 App 统一提供 -->
  <main class="page">
    <section class="progress-block" aria-label="填写进度">
      <div class="progress"><span style="width:30%"></span></div>
      <p>已完成30%</p>
    </section>

    <form id="csiForm">
      <section class="questionnaire">
        <h1>中枢敏化程度：中枢敏化指数（CSI-9）</h1>

        <fieldset class="question">
          <legend>1. 我晨起后仍觉疲惫且没精神</legend>
          <div class="options">
            <label><input type="radio" name="q1" value="从不">从不</label>
            <label><input type="radio" name="q1" value="很少">很少</label>
            <label><input type="radio" name="q1" value="有时">有时</label>
            <label><input type="radio" name="q1" value="经常">经常</label>
            <label><input type="radio" name="q1" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>2. 我感到肌肉僵硬且疼痛</legend>
          <div class="options">
            <label><input type="radio" name="q2" value="从不">从不</label>
            <label><input type="radio" name="q2" value="很少">很少</label>
            <label><input type="radio" name="q2" value="有时">有时</label>
            <label><input type="radio" name="q2" value="经常">经常</label>
            <label><input type="radio" name="q2" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>3. 我感觉浑身疼痛</legend>
          <div class="options">
            <label><input type="radio" name="q3" value="从不">从不</label>
            <label><input type="radio" name="q3" value="很少">很少</label>
            <label><input type="radio" name="q3" value="有时">有时</label>
            <label><input type="radio" name="q3" value="经常">经常</label>
            <label><input type="radio" name="q3" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>4. 我头痛</legend>
          <div class="options">
            <label><input type="radio" name="q4" value="从不">从不</label>
            <label><input type="radio" name="q4" value="很少">很少</label>
            <label><input type="radio" name="q4" value="有时">有时</label>
            <label><input type="radio" name="q4" value="经常">经常</label>
            <label><input type="radio" name="q4" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>5. 我睡觉不好</legend>
          <div class="options">
            <label><input type="radio" name="q5" value="从不">从不</label>
            <label><input type="radio" name="q5" value="很少">很少</label>
            <label><input type="radio" name="q5" value="有时">有时</label>
            <label><input type="radio" name="q5" value="经常">经常</label>
            <label><input type="radio" name="q5" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>6. 我很难集中注意力</legend>
          <div class="options">
            <label><input type="radio" name="q6" value="从不">从不</label>
            <label><input type="radio" name="q6" value="很少">很少</label>
            <label><input type="radio" name="q6" value="有时">有时</label>
            <label><input type="radio" name="q6" value="经常">经常</label>
            <label><input type="radio" name="q6" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>7. 精神压力导致我的身体症状恶化</legend>
          <div class="options">
            <label><input type="radio" name="q7" value="从不">从不</label>
            <label><input type="radio" name="q7" value="很少">很少</label>
            <label><input type="radio" name="q7" value="有时">有时</label>
            <label><input type="radio" name="q7" value="经常">经常</label>
            <label><input type="radio" name="q7" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>8. 我的颈部和肩部肌肉紧张</legend>
          <div class="options">
            <label><input type="radio" name="q8" value="从不">从不</label>
            <label><input type="radio" name="q8" value="很少">很少</label>
            <label><input type="radio" name="q8" value="有时">有时</label>
            <label><input type="radio" name="q8" value="经常">经常</label>
            <label><input type="radio" name="q8" value="总是">总是</label>
          </div>
        </fieldset>

        <fieldset class="question">
          <legend>9. 我记性差</legend>
          <div class="options">
            <label><input type="radio" name="q9" value="从不">从不</label>
            <label><input type="radio" name="q9" value="很少">很少</label>
            <label><input type="radio" name="q9" value="有时">有时</label>
            <label><input type="radio" name="q9" value="经常">经常</label>
            <label><input type="radio" name="q9" value="总是">总是</label>
          </div>
        </fieldset>
      </section>

      <section class="result">
        <span>是否&gt;18分：</span>
        <strong id="resultText">--</strong>
      </section>

      <div class="bottom-action">
        <button type="submit">保存并返回</button>
      </div>
    </form>
  </main>

  <script src="js/csi.js"></script>
</body>
</html>
